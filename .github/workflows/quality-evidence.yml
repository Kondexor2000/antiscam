name: Quality evidence

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt -e .
      - run: mkdir -p artifacts
      - run: python -m pytest --junitxml=artifacts/python-tests.xml
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-results
          path: artifacts/python-tests.xml
          if-no-files-found: ignore

  dotnet-tests:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: 'Local_test_Password!2026'
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Local_test_Password!2026' -C -Q 'SELECT 1' -b"
          --health-interval 10s --health-timeout 5s --health-retries 20 --health-start-period 30s
    env:
      ANTISCAM_TEST_SQLSERVER: 'Server=localhost,1433;Database=master;User Id=sa;Password=Local_test_Password!2026;Encrypt=True;TrustServerCertificate=True'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test AntiScamBlog.sln --logger "trx;LogFileName=dotnet-tests.trx"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

  load-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start isolated application stack
        env:
          MSSQL_SA_PASSWORD: 'Local_test_Password!2026'
          ANTISCAM_CONTROL_PLANE_KEY: 'ci-test-management-key-0123456789abcdef'
        run: docker compose up -d --build
      - run: mkdir -p artifacts
      - uses: grafana/setup-k6-action@v1
      - name: Wait for APIs
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8000/ >/dev/null && curl -fsS http://127.0.0.1:5000/api/health >/dev/null && exit 0
            sleep 5
          done
          docker compose ps
          docker compose logs --tail=100
          exit 1
      - name: Load test scan API
        run: k6 run --summary-export=artifacts/scan-summary.json tests/load/scan.js
      - name: Load test blog API
        run: k6 run --summary-export=artifacts/blog-summary.json tests/load/blog.js
      - name: Build performance report
        if: always()
        run: python tests/load/report.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-report
          path: artifacts/
          if-no-files-found: ignore
      - if: always()
        run: docker compose down -v

  security-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: "mkdir -p artifacts/security && : > artifacts/security/status.txt"
      - name: Python dependency audit
        run: |
          python -m pip install pip-audit
          set +e
          pip-audit -r requirements-dev.txt --format json > artifacts/security/pip-audit.json
          echo "pip-audit exit: $?" >> artifacts/security/status.txt
      - name: .NET dependency audit
        run: |
          dotnet restore AntiScamBlog.sln
          set +e
          dotnet list AntiScamBlog.sln package --vulnerable --include-transitive > artifacts/security/dotnet-vulnerable.txt 2>&1
          echo "dotnet audit exit: $?" >> artifacts/security/status.txt
      - name: Python static security checks
        run: |
          python -m pip install bandit
          set +e
          bandit -r antiscam -f json -o artifacts/security/bandit.json
          echo "bandit exit: $?" >> artifacts/security/status.txt
      - name: Python penetration regression tests
        run: |
          python -m pip install -r requirements-dev.txt -e .
          set +e
          python -m pytest tests/integration/test_penetration.py --junitxml=artifacts/security/penetration-tests.xml
          echo "penetration tests exit: $?" >> artifacts/security/status.txt
      - name: Create report index
        if: always()
        run: |
          {
            echo '# Automated security checks'
            echo
            echo 'Generated by the GitHub Actions security-report job. Raw tool outputs are attached to this artifact.'
            echo
            echo 'Checks: pip-audit (Python dependencies), dotnet list package --vulnerable (NuGet dependencies), Bandit (Python source), Python penetration regression tests.'
            echo
            echo 'Exit statuses:'
            cat artifacts/security/status.txt
          } > artifacts/security/report.md
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: artifacts/security/
