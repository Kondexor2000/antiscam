services:
  blog-api:
    build:
      context: .
      dockerfile: ci/dotnet/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Network__HttpPort: 8080
      ANTISCAM_BLOG_CONNECTION_STRING: Server=sqlserver,1433;Database=AntiScamBlog;User Id=sa;Password=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env};Encrypt=True;TrustServerCertificate=True
      ANTISCAM_CONTROL_PLANE_KEY: ${ANTISCAM_CONTROL_PLANE_KEY:?Set ANTISCAM_CONTROL_PLANE_KEY in .env}
      ANTISCAM_REDIS_CONNECTION_STRING: redis:6379
      ANTISCAM_MONGO_CONNECTION_STRING: mongodb://mongo:27017
      NoSql__Enabled: ${ANTISCAM_MONGO_ENABLED:-false}
    ports:
      - "${BLOG_API_PORT:-5000}:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      sql-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/8080'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  python-api:
    build:
      context: .
      dockerfile: ci/python/Dockerfile
    ports:
      - "${PYTHON_API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  sql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    entrypoint: ["/opt/mssql-tools18/bin/sqlcmd"]
    command:
      - "-S"
      - "sqlserver,1433"
      - "-U"
      - "sa"
      - "-P"
      - "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}"
      - "-C"
      - "-Q"
      - "IF DB_ID(N'AntiScamBlog') IS NULL CREATE DATABASE [AntiScamBlog];"
      - "-b"
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  mongo:
    image: mongo:7
    profiles: ["nosql"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  sqlserver-data:
  redis-data:
  mongo-data:
