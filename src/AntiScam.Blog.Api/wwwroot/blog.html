<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AntiScam Blog bezpieczeństwa</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/blog.css"></head>
<body class="blog-page"><header class="blog-header"><a href="/">← API Control Plane</a><p class="overline">ANTISCAM · WIEDZA I PREWENCJA</p><h1>Blog bezpieczeństwa</h1><p>Praktyczne wpisy o phishingu, fałszywych linkach i ochronie przed oszustwami.</p></header><main class="blog-layout"><section class="panel"><div class="blog-section-head"><div><h2 id="posts-heading">Najnowszy wpis</h2><a href="/blog.html?view=all">Zobacz wszystkie posty</a></div><span id="workspace" class="meta"></span></div><div id="posts" class="blog-posts" aria-live="polite"></div></section><aside class="panel"><h2>Dodaj wpis</h2><form id="post-form"><label>Tytuł<input name="title" required maxlength="160"></label><label>Streszczenie<textarea name="summary" required maxlength="300"></textarea></label><label>Treść<textarea name="content" required></textarea></label><label>Autor<input name="author" required maxlength="100" value="Czytelnik"></label><button type="submit">Opublikuj</button></form><p id="form-status" class="status" role="status"></p></aside></main><script src="/blog.js"></script></body></html>
