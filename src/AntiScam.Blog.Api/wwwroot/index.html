<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AntiScam Blog</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="site-header">
    <div>
      <p class="eyebrow">AntiScam</p>
      <h1>Blog bezpieczeństwa</h1>
      <p class="lead">Praktyczne wpisy o phishingu, fałszywych linkach i ochronie przed oszustwami.</p>
    </div>
  </header>

  <main class="layout">
    <section class="panel">
      <div class="section-heading">
        <div>
          <h2 id="posts-heading">Najnowszy wpis</h2>
          <a class="all-posts-link" href="/?view=all">Zobacz wszystkie posty</a>
        </div>
        <span id="workspace" class="workspace"></span>
      </div>
      <div id="posts" class="posts" aria-live="polite"></div>
    </section>

    <aside class="panel form-panel">
      <h2>Konto</h2>
      <form id="auth-form">
        <label>Nazwa użytkownika<input name="userName" required minlength="3" maxlength="100"></label>
        <label>Hasło<input name="password" type="password" required minlength="12" autocomplete="current-password"></label>
        <div class="auth-actions"><button type="submit" data-action="login">Zaloguj</button><button type="submit" data-action="register">Zarejestruj</button><button type="button" id="logout-button">Wyloguj</button></div>
      </form>
      <p id="auth-status" class="status" role="status"></p>

      <section id="admin-panel" class="admin-panel" hidden>
        <h2>Panel administratora</h2>
        <p id="admin-status" class="status" role="status"></p>
        <h3>Użytkownicy</h3>
        <div id="admin-users" class="admin-list"></div>
        <h3>Posty</h3>
        <div id="admin-posts" class="admin-list"></div>
      </section>

      <h2>Dodaj wpis</h2>
      <form id="post-form">
        <label>
          Tytuł
          <input id="title" name="title" required maxlength="160">
        </label>
        <label>
          Streszczenie
          <textarea id="summary" name="summary" required maxlength="300"></textarea>
        </label>
        <label>
          Treść
          <textarea id="content" name="content" required></textarea>
        </label>
        <fieldset class="publication-identity">
          <legend>Publikuj jako</legend>
          <label><input type="radio" name="post-author-mode" value="guest" checked> Gość</label>
          <label><input type="radio" name="post-author-mode" value="user" disabled> Zalogowany użytkownik</label>
        </fieldset>
        <label>
          <span class="author-label">Nazwa gościa</span>
          <input id="author" name="author" required maxlength="100" value="Czytelnik">
        </label>
        <button type="submit">Opublikuj</button>
      </form>
      <p id="form-status" class="status" role="status"></p>
    </aside>
  </main>

  <script src="/app.js?v=20260802-author-mode"></script>
</body>
</html>
